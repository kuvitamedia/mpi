        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.065, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + length);
        oscillator.connect(gain); gain.connect(audioContext.destination);
        oscillator.start(); oscillator.stop(audioContext.currentTime + length);
      } catch (_) { /* The game remains playable if audio is unavailable. */ }
    }

    function startMusic() {
      if (muted) return;
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        stopMusic();
        musicGain = audioContext.createGain();
        musicGain.gain.value = .028;
        musicGain.connect(audioContext.destination);
        const notes = [261.63, 329.63, 392, 329.63, 293.66, 349.23, 440, 349.23];
        musicStep = 0;
        const playNote = () => {
          if (!playing || muted || !audioContext || !musicGain) return;
          const oscillator = audioContext.createOscillator();
          const noteGain = audioContext.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.value = notes[musicStep % notes.length];
          noteGain.gain.setValueAtTime(.001, audioContext.currentTime);
          noteGain.gain.exponentialRampToValueAtTime(1, audioContext.currentTime + .025);
          noteGain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .24);
          oscillator.connect(noteGain); noteGain.connect(musicGain);
          oscillator.start(); oscillator.stop(audioContext.currentTime + .25);
          musicStep++;
        };
        playNote();
        musicTimer = setInterval(playNote, 280);
      } catch (_) { /* Permainan tetap berjalan jika audio tidak tersedia. */ }
    }
    function stopMusic() {
      clearInterval(musicTimer);
      musicTimer = null;
      if (musicGain) { musicGain.disconnect(); musicGain = null; }
    }

    function updateTimer() {
      const minutes = String(Math.floor(remaining / 60)).padStart(2, '0');
      const seconds = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = `${minutes}:${seconds}`;
    }
    function updateScores() {
      document.getElementById('left-score').textContent = scores[0];
      document.getElementById('right-score').textContent = scores[1];
      const difference = scores[1] - scores[0];
      document.getElementById('ribbon').style.left = `${50 + Math.max(-5, Math.min(5, difference)) * 6.4}%`;
    }
    function renderQuestion(player) {
      const q = questions[player] = makeQuestion();
      const side = player === 0 ? 'left' : 'right';
      document.getElementById(`${side}-question`).textContent = q.label;
      optionButtons[player].forEach((button, index) => {
        button.textContent = q.choices[index];
        button.disabled = false;
        button.classList.remove('wrong');
        button.setAttribute('aria-label', `Pemain ${player + 1}, pilihan ${index + 1}: ${q.choices[index]}`);
      });
    }
    function answer(player, index) {
      if (!playing) return;
      const button = optionButtons[player][index];
      if (button.disabled) return;
      if (questions[player].choices[index] !== questions[player].answer) {
        button.classList.add('wrong');
        button.disabled = true;
        tone(190, .16);
        return;
      }
      scores[player]++;
      updateScores();
      tone(player === 0 ? 570 : 690);
      if (Math.abs(scores[0] - scores[1]) >= 5) {
        finish(player);
      } else {
        renderQuestion(player);
      }
    }
    function finish(winner) {
      playing = false;
      clearInterval(interval);
      stopMusic();
      optionButtons.flat().forEach(button => button.disabled = true);
      if (winner === null) {
        overlayTitle.textContent = 'Waktu habis!';
        overlayDescription.textContent = `Skor akhir ${scores[0]}–${scores[1]}. Belum ada yang unggul 5 jawaban, jadi belum ada pemenang.`;
      } else {
        overlayTitle.textContent = `Pemain ${winner + 1} menang!`;
        overlayDescription.textContent = `Skor akhir ${scores[0]}–${scores[1]}. Selisih 5 jawaban berhasil diraih!`;
        tone(880, .32);
      }
      playButton.textContent = 'Main lagi →';
      overlay.classList.remove('hidden');
      playButton.focus();
    }
    function start() {
      clearInterval(interval);
      scores[0] = scores[1] = 0;
      remaining = duration;
      playing = true;
      updateTimer();
      updateScores();
      renderQuestion(0);
      renderQuestion(1);
      overlay.classList.add('hidden');
      startMusic();
      interval = setInterval(() => {
        if (!playing) return;
        remaining--;
        updateTimer();
        if (remaining <= 0) finish(null);
      }, 1000);
    }

    for (let player = 0; player < 2; player++) {
      const side = player === 0 ? 'left' : 'right';
      const holder = document.getElementById(`${side}-options`);
      for (let index = 0; index < 3; index++) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer rounded-xl py-3 px-1 font-extrabold';
        button.style.fontSize = 'clamp(20px, 2.5vw, 28px)';
        button.style.background = player === 0 ? '#d9edf3' : '#ffead9';
        button.style.color = '#263b42';
        button.disabled = true;
        button.textContent = '—';
        button.addEventListener('click', () => answer(player, index));
        holder.appendChild(button);
        optionButtons[player].push(button);
      }
    }
    playButton.addEventListener('click', start);
    document.addEventListener('keydown', event => {
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey || !playing) return;
      const key = event.key.toLowerCase();
      for (let player = 0; player < 2; player++) {
        const index = keys[player].indexOf(key);
        if (index !== -1) { event.preventDefault(); answer(player, index); return; }
      }
    });
    document.getElementById('sound-button').addEventListener('click', event => {
      muted = !muted;
      event.currentTarget.setAttribute('aria-pressed', String(!muted));
      event.currentTarget.setAttribute('aria-label', muted ? 'Nyalakan suara' : 'Matikan suara');
      document.getElementById('sound-on').classList.toggle('hidden', muted);
      document.getElementById('sound-off').classList.toggle('hidden', !muted);
      if (muted) stopMusic();
      else { tone(540); if (playing) startMusic(); }
    });
  </script>
 </body>
</html>
